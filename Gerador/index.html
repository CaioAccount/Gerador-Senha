<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senha</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-grid"></div>

  <div class="card">
    <header class="card-header">
      <div class="lock-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>Gerador de Senha</h1>
      <div class="counter-badge">
        <span id="gen-count">0</span> geradas
      </div>
    </header>

    <!-- Resultado -->
    <div class="result-box">
      <input type="password" id="password" readonly placeholder="clique em gerar...">
      <div class="result-actions">
        <button id="toggle-vis" title="Mostrar/ocultar senha" aria-label="Mostrar senha">
          <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
        <button id="copy" title="Copiar senha (Ctrl+C)" aria-label="Copiar senha">
          <svg class="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Força -->
    <div class="strength-section">
      <div class="strength-bar-track">
        <div id="bar"></div>
      </div>
      <div class="strength-info">
        <span id="feedback"></span>
        <span id="crack-time"></span>
      </div>
    </div>

    <!-- Aviso -->
    <div class="warning-box" id="warning-box" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <span id="warning-msg"></span>
    </div>

    <!-- Controles -->
    <div class="controls">
      <div class="slider-row">
        <label>Tamanho</label>
        <div class="slider-wrap">
          <input type="range" min="6" max="40" value="16" id="slider" step="1">
        </div>
        <span class="slider-value" id="valor">16</span>
      </div>

      <div class="options-grid">
        <label class="opt-label">
          <input type="checkbox" id="lower" checked>
          <span class="opt-text">minúsculas <em>abc</em></span>
        </label>
        <label class="opt-label">
          <input type="checkbox" id="upper" checked>
          <span class="opt-text">maiúsculas <em>ABC</em></span>
        </label>
        <label class="opt-label">
          <input type="checkbox" id="number" checked>
          <span class="opt-text">números <em>123</em></span>
        </label>
        <label class="opt-label">
          <input type="checkbox" id="symbol">
          <span class="opt-text">símbolos <em>!@#</em></span>
        </label>
        <label class="opt-label full">
          <input type="checkbox" id="noambig">
          <span class="opt-text">excluir ambíguos <em>0 O l 1 I</em></span>
        </label>
      </div>
    </div>

    <button id="generate">
      <span class="btn-label">Gerar senha</span>
      <kbd>Enter</kbd>
    </button>

    <!-- Histórico -->
    <div class="history-section" id="history-section" style="display:none">
      <div class="history-header">
        <span>Histórico da sessão</span>
        <button id="clear-history">limpar</button>
      </div>
      <ul id="history-list"></ul>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
